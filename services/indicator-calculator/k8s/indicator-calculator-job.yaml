apiVersion: batch/v1
kind: Job
metadata:
  name: indicator-calculator-job
  namespace: stf # Assuming 'stf' namespace for services
  labels:
    app: indicator-calculator
spec:
  template:
    metadata:
      labels:
        app: indicator-calculator
    spec:
      restartPolicy: Never
      containers:
        - name: indicator-calculator
          image: registry.dmz.home/kinga/stream-forge/indicator-calculator:1.0.0 # Placeholder image
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "k3-kafka-bootstrap.kafka:9093" # Placeholder
            - name: ARANGO_URL
              value: "http://abase-3.dmz.home:8529" # Placeholder
            - name: ARANGO_DB
              value: "streamforge" # Placeholder
            - name: KAFKA_USER_PRODUCER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_USER
            - name: KAFKA_PASSWORD_PRODUCER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_PASSWORD
            - name: ARANGO_USER
              value: "root"
            - name: ARANGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: ARANGO_PASSWORD
            - name: CA_PATH
              value: "/usr/local/share/ca-certificates/ca.crt" # Placeholder
          volumeMounts:
            - name: kafka-ca-volume
              mountPath: /usr/local/share/ca-certificates/ca.crt
              subPath: dev-ca.crt
              readOnly: true
      volumes:
        - name: kafka-ca-volume
          configMap:
            name: dev-ca-certificates
      serviceAccountName: full-access-sa # Assuming a service account with necessary permissions
      nodeSelector:
        streamforge-node: "true" # Assuming a node selector
