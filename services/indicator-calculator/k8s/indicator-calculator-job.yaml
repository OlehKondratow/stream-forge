apiVersion: batch/v1
kind: Job
metadata:
  name: indicator-calculator-job-test
  namespace: stf # Assuming 'stf' namespace for services
  labels:
    app: indicator-calculator
    queue-id: indicator-calculator-test
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: indicator-calculator
    spec:
      restartPolicy: Never
      containers:
        - name: indicator-calculator
          image: registry.dmz.home/kinga/stream-forge/indicator-calculator:0.0.1 # Placeholder image
          imagePullPolicy: Always
          env:
            - name: QUEUE_ID
              value: "indicator-calculator-test"
            - name: SYMBOL
              value: "PIXELUSDT"
            - name: INDICATORS_CONFIG
              value: |
                [
                  {"name": "RSI", "enabled": true, "params": {"period": 14}},
                  {"name": "MACD", "enabled": true, "params": {"fast": 12, "slow": 26, "signal": 9}}
                ]
            - name: DB_COLLECTION
              value: "technical_indicators_stream"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "k3-kafka-bootstrap.kafka:9093"
            - name: KAFKA_TOPIC
              value: "pixelusdt-orderbook" # Input topic for orderbook data
            - name: TELEMETRY_PRODUCER_ID
              value: "indicator-calculator-test-instance"
            - name: LOGURU_LEVEL
              value: "DEBUG"
            - name: KAFKA_USER_PRODUCER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_USER
            - name: KAFKA_PASSWORD_PRODUCER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_PASSWORD
            - name: KAFKA_USER_CONSUMER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_USER
            - name: KAFKA_PASSWORD_CONSUMER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_PASSWORD
            - name: CA_PATH
              value: "/usr/local/share/ca-certificates/ca.crt"
            - name: CONTROL_TOPIC
              value: "queue-control"
            - name: TELEMETRY_TOPIC
              value: "queue-events"
            - name: CANDLE_INTERVAL
              value: "1m"
            - name: ARANGO_URL
              value: "http://abase-3.dmz.home:8529"
            - name: ARANGO_DB
              value: "streamforge"
            - name: ARANGO_USER
              value: "root"
            - name: ARANGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: ARANGO_PASSWORD
          volumeMounts:
            - name: kafka-ca-volume
              mountPath: /usr/local/share/ca-certificates/ca.crt
              subPath: dev-ca.crt
              readOnly: true
      volumes:
        - name: kafka-ca-volume
          configMap:
            name: dev-ca-certificates
      serviceAccountName: full-access-sa # Assuming a service account with necessary permissions
      nodeSelector:
        streamforge-node: "true" # Assuming a node selector
