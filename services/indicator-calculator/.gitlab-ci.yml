include:
  - project: 'kinga/stream-forge'
    ref: main
    file: '/.gitlab/ci-templates/Python-Service.gitlab-ci.yml'
  - project: 'kinga/stream-forge'
    ref: main
    file: '/.gitlab/ci-templates/Kubernetes-Deploy.gitlab-ci.yml'

build-indicator-calculator:
  extends: .build_python_service
  needs:
    - test-indicator-calculator
  variables:
    SERVICE_NAME: indicator-calculator
    SERVICE_PATH: services/indicator-calculator
    CI_REGISTRY_IMAGE: $CI_REGISTRY/kinga/stream-forge/indicator-calculator

integration-test-indicator-calculator:
  extends: .integration_test_python_service
  needs:
    - build-indicator-calculator
  variables:
    SERVICE_NAME: indicator-calculator
    SERVICE_PATH: services/indicator-calculator
  when: manual # Make it manual for now, user can change later

test-indicator-calculator:
  extends: .test_python_service
  variables:
    SERVICE_PATH: services/indicator-calculator
  script:
    - pip install -r $CI_PROJECT_DIR/$SERVICE_PATH/requirements.txt
    - pip install -r $CI_PROJECT_DIR/$SERVICE_PATH/requirements-test.txt
    - export PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR/$SERVICE_PATH
    - python -m pytest $CI_PROJECT_DIR/$SERVICE_PATH/tests/ --ignore=$CI_PROJECT_DIR/$SERVICE_PATH/tests/integration/ --junitxml=${SERVICE_NAME}-${CI_COMMIT_SHORT_SHA}-report.xml --durations=0
  when: manual

deploy-indicator-calculator:
  extends: .deploy_kubernetes_service
  needs:
    - integration-test-indicator-calculator
  variables:
    K8S_MANIFEST_PATH: services/indicator-calculator/k8s/indicator-calculator-job.yaml

update-badge-indicator-calculator:
  extends: .update_badge_python_service
  needs:
    - build-indicator-calculator
    - deploy-indicator-calculator
  variables:
    SERVICE_NAME: indicator-calculator
    SERVICE_PATH: services/indicator-calculator
  when: manual # Make it manual for now, user can change later
