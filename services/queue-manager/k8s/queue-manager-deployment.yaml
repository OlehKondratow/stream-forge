apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-manager
  namespace: stf
  labels:
    app: queue-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-manager
  template:
    metadata:
      labels:
        app: queue-manager
    spec:
      containers:
        - name: queue-manager
          image: registry.dmz.home/kinga/stream-forge/queue-manager:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: K8S_NAMESPACE
              value: "stf"
            # Переменные, которые ожидает приложение
            - name: LOADER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: LOADER_IMAGE_WS_ORDERBOOK # Используем один из образов как значение по умолчанию
            - name: CONSUMER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: DUMMY_SERVICE_IMAGE # Пример, можно выбрать другой
            # Более гранулярные переменные для гибкости
            - name: LOADER_IMAGE_WS_ORDERBOOK
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: LOADER_IMAGE_WS_ORDERBOOK
            - name: LOADER_IMAGE_API_CANDLES
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: LOADER_IMAGE_API_CANDLES
            - name: LOADER_IMAGE_API_TRADES
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: LOADER_IMAGE_API_TRADES
            - name: DUMMY_SERVICE_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: DUMMY_SERVICE_IMAGE
            - name: GNN_TRAINER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: GNN_TRAINER_IMAGE
            - name: VISUALIZER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: VISUALIZER_IMAGE
            - name: ARANGO_CONNECTOR_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: queue-manager-loaders-config
                  key: ARANGO_CONNECTOR_IMAGE
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "k3-kafka-bootstrap.kafka:9093"
            - name: KAFKA_USER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_USER
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: KAFKA_PASSWORD
            - name: ARANGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: ARANGO_PASSWORD
            - name: ARANGO_URL
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: ARANGO_URL
            - name: ARANGO_DB
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: ARANGO_DB
            - name: ARANGO_USER
              valueFrom:
                secretKeyRef:
                  name: stf-shared-secret
                  key: ARANGO_USER
            - name: CA_PATH
              value: "/usr/local/share/ca-certificates/ca.crt"
          volumeMounts:
            - name: kafka-ca-volume
              mountPath: /usr/local/share/ca-certificates/ca.crt
              subPath: dev-ca.crt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: kafka-ca-volume
          configMap:
            name: dev-ca-certificates

---

apiVersion: v1
kind: Service
metadata:
  name: queue-manager-svc
  namespace: stf
spec:
  selector:
    app: queue-manager
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http
